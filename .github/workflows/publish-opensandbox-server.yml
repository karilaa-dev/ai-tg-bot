name: Publish OpenSandbox server compatibility image

on:
  pull_request:
    paths:
      - 'docker/opensandbox/server/**'
      - '.github/workflows/publish-opensandbox-server.yml'
  push:
    branches:
      - main
    paths:
      - 'docker/opensandbox/server/**'
      - '.github/workflows/publish-opensandbox-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-opensandbox-server-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: karilaa-dev/opensandbox-server

jobs:
  verify:
    name: Verify compatibility image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./docker/opensandbox/server
          load: true
          tags: opensandbox-server:verify
          cache-from: type=gha,scope=opensandbox-server
          cache-to: type=gha,mode=max,scope=opensandbox-server

      - name: Verify permitted egress variables
        run: |
          docker run --rm --entrypoint python opensandbox-server:verify -c \
            "from opensandbox_server.services.constants import ALLOWED_EGRESS_ENV_VARS as a; assert {'OPENSANDBOX_EGRESS_DNS_UPSTREAM', 'OPENSANDBOX_EGRESS_NAMESERVER_EXEMPT'} <= a"

  publish:
    name: Build and publish
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v0.2.2-ai-tg-bot
            type=raw,value=v0.2.2-ai-tg-bot.1
            type=sha,prefix=v0.2.2-ai-tg-bot-sha-,format=long

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./docker/opensandbox/server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=opensandbox-server
          cache-to: type=gha,mode=max,scope=opensandbox-server
