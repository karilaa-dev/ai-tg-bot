services:
  bot:
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      E2B_API_KEY: ${E2B_API_KEY:?set E2B_API_KEY}
      E2B_TEMPLATE: ${E2B_TEMPLATE:-ai-tg-bot-tools:production}
      E2B_DEPLOYMENT_ID: ${E2B_DEPLOYMENT_ID:-ai-tg-bot}
      E2B_FILE_SOURCE_MAX_BYTES: ${E2B_FILE_SOURCE_MAX_BYTES:-2147483648}
      TELEGRAM_FILE_RESTORE_TIMEOUT_MS: ${TELEGRAM_FILE_RESTORE_TIMEOUT_MS:-300000}
      TELEGRAM_FILE_RESTORE_CONCURRENCY: ${TELEGRAM_FILE_RESTORE_CONCURRENCY:-4}
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      PI_CODING_AGENT_DIR: /app/data/pi
    volumes:
      - bot-data:/app/data
      - pi-home:/app/data/pi
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - egress
      - database
    stop_grace_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: aibot
      POSTGRES_USER: aibot
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  bot-data:
  pi-home:
  pg-data:

networks:
  egress:
  database:
    internal: true
