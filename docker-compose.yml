services:
  bot:
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      AGENT_SHARED_ROOT: /data
      MANAGED_FILE_ROOT: /data/.chat-files
      OPEN_SANDBOX_DOMAIN: ${OPEN_SANDBOX_DOMAIN:-opensandbox-server:8080}
      OPEN_SANDBOX_PROTOCOL: ${OPEN_SANDBOX_PROTOCOL:-http}
      OPEN_SANDBOX_API_KEY: ${OPEN_SANDBOX_API_KEY:?set OPEN_SANDBOX_API_KEY}
      OPEN_SANDBOX_USE_SERVER_PROXY: ${OPEN_SANDBOX_USE_SERVER_PROXY:-true}
      OPEN_SANDBOX_SHARED_HOST_ROOT: ${BOT_SHARED_HOST_PATH:?set BOT_SHARED_HOST_PATH to the shared host folder}
      OPEN_SANDBOX_IMAGE: ${OPEN_SANDBOX_IMAGE:-ghcr.io/karilaa-dev/ai-agent-box:latest}
      OPEN_SANDBOX_USER: ${OPEN_SANDBOX_USER:-agent}
      OPEN_SANDBOX_GROUP: ${OPEN_SANDBOX_GROUP:-agent}
      OPEN_SANDBOX_UID: ${OPEN_SANDBOX_UID:-1000}
      OPEN_SANDBOX_GID: ${OPEN_SANDBOX_GID:-1000}
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      PI_CODING_AGENT_DIR: /app/data/pi
    volumes:
      - bot-data:/app/data
      - type: bind
        source: ${BOT_SHARED_HOST_PATH:?set BOT_SHARED_HOST_PATH to the shared host folder}
        target: /data
        bind:
          create_host_path: false
      - pi-home:/app/data/pi
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - opensandbox
      - database
    stop_grace_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aibot
      POSTGRES_USER: aibot
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  bot-data:
  pi-home:
  pg-data:

networks:
  opensandbox:
    name: ${OPEN_SANDBOX_NETWORK:-ai-tg-bot-opensandbox}
    external: true
  database:
    internal: true
